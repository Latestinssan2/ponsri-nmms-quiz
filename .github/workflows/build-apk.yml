name: Build & Release NMMS Ponsri Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Keystore from Secret
        run: |
          mkdir -p android-keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android-keystore/release.jks
          fi

      - name: Install Gradle Wrapper
        working-directory: android_app
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: android_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Ponsri@2026Secure' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ponsri-release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Ponsri@2026Secure' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for Release
        working-directory: android_app
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/NMMS_Ponsri_Secure_Exam.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMMS_Ponsri_Secure_Exam_APK
          path: android_app/app/build/outputs/apk/release/NMMS_Ponsri_Secure_Exam.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android_app/app/build/outputs/apk/release/NMMS_Ponsri_Secure_Exam.apk
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: NMMS Ponsri Secure Exam App ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 PM SHRI PRATHMIK VIDHYAMANDIR PONSRI
            ### NMMS Secure Examination Official Android App

            **મુખ્ય વિશેષતાઓ (Features):**
            - 🔒 **સુરક્ષિત પરીક્ષા મોડ (Anti-Cheat 3-Strike System)**: પરીક્ષા દરમિયાન ૩ વાર એપ બહાર નીકળવા કે સ્ક્રીન બંધ થવા પર પેપર આપમેળે જમા (Auto-Submit).
            - 🔆 **સ્ક્રીન જાગૃત રહે છે (Screen Keep Awake)**: કસોટી આપતી વખતે સ્ક્રીન આપમેળે સ્લીપ થતી નથી.
            - 🔔 **લાઈવ કસોટી નોટિફિકેશન (Live Quiz Push Notification)**.
            - 👑 **એડમિન કંટ્રોલ પેનલ સપોર્ટ**.
            - 🔐 **કાયમી સહી કરેલ (Permanent Signed APK)**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
