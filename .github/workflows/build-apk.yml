name: Build & Release NMMS Ponsri Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: Restore Keystore from Secret
        run: |
          mkdir -p android-keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android-keystore/release.jks
          fi

      - name: Restore Google Services JSON from Secret
        run: |
          mkdir -p flutter_app/android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > flutter_app/android/app/google-services.json
          fi

      - name: Install Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Signed Release APK
        working-directory: flutter_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Ponsri@2026Secure' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ponsri-release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Ponsri@2026Secure' }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Copy & Rename APK for Release
        run: |
          mkdir -p release_out
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk release_out/NMMS_Ponsri_Secure_Exam.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMMS_Ponsri_Secure_Exam_APK
          path: release_out/NMMS_Ponsri_Secure_Exam.apk

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: release_out/NMMS_Ponsri_Secure_Exam.apk
          tag_name: ${{ github.ref_name || 'v1.5.0' }}
          name: NMMS & CET Ponsri Exam App ${{ github.ref_name || 'v1.5.0' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 📱 PM SHRI PRATHMIK VIDHYAMANDIR PONSRI
            ### NMMS & CET Secure Examination Official Flutter Android App

            **મુખ્ય વિશેષતાઓ (Features):**
            - 🎓 **મલ્ટી-ક્લાસ સપોર્ટ (Multi-Class Management)**: ધોરણ ૫ કોમન પ્રવેશ પરીક્ષા (CET Test 49 - 40 પ્રશ્નો, 60 મિનિટ) અને ધોરણ ૮ નેશનલ મીન્સ કમ મેરીટ સ્કોલરશીપ (NMMS Paper 52 - 180 પ્રશ્નો, 180 મિનિટ) માટે એક જ એપમાં સીમલેસ સ્વિચિંગ.
            - ☁️ **ફાયરબેઝ મલ્ટી-ક્લાસ કોન્ફિગરેશન (Firebase Multi-Class Config)**: એડમિન દ્વારા દરેક ધોરણ માટે અલગ અલગ લાઈવ કસોટી સેટ કરવાની સુવિધા (`app_config/multi_class`).
            - 🎨 **Minimal Distraction-Free UI**: 4 કસ્ટમ થીમ્સ (Modern Indigo, OLED Dark, Forest Sage, Warm Sepia).
            - 🔒 **સુરક્ષિત પરીક્ષા મોડ (Anti-Cheat 3-Strike System)**: પરીક્ષા દરમિયાન ૩ વાર એપ બહાર નીકળવા, મિનિમાઇઝ કરવા કે સ્ક્રીન બંધ થવા પર પેપર આપમેળે જમા (Auto-Submit).
            - 🔆 **સ્ક્રીન જાગૃત રહે છે (Screen Keep Awake)**: કસોટી આપતી વખતે સ્ક્રીન આપમેળે સ્લીપ થતી નથી.
            - 🔔 **લાઈવ કસોટી નોટિફિકેશન (Live Quiz Push Notification)**.
            - 👑 **એડમિન કંટ્રોલ પેનલ સપોર્ટ**.
            - 🔐 **કાયમી સહી કરેલ (Permanent Signed Keystore)**.
            - ☁️ **Google Services Firebase Integration**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
