name: Build & Release NMMS Ponsri Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Keystore from Secret
        run: |
          mkdir -p android-keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android-keystore/release.jks
          fi

      - name: Generate Gradle Wrapper
        working-directory: android_app
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: android_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'Ponsri@2026Secure' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ponsri-release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'Ponsri@2026Secure' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmms-ponsri-release-apk
          path: android_app/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: android_app/app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: NMMS Ponsri Exam Official Release ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 PM SHRI PRATHMIK VIDHYAMANDIR PONSRI
            ### NMMS Secure Examination App - Official Release

            **મુખ્ય વિશેષતાઓ (Features):**
            - 🔒 **સુરક્ષિત પરીક્ષા મોડ (Anti-Cheat)**: કસોટી દરમિયાન ૩ વખત એપ મિનિમાઇઝ કરવા પર આપમેળે જમા (Auto-Submit).
            - 🔆 **સ્ક્રીન જાગૃત રહે છે (Screen Keep Awake)**: પરીક્ષા આપતી વખતે સ્ક્રીન બંધ થતી નથી.
            - 🔔 **લાઈવ કસોટી નોટિફિકેશન (Live Quiz Notification)**.
            - 👑 **એડમિન કંટ્રોલ પેનલ ઍક્સેસ**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
